<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Miku Nakano Mobile AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #0b0f19;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        header {
            background: rgba(15, 23, 42, 0.95);
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 15px;
            padding-right: 15px;
        }
        .config-btn {
            background: none;
            border: none;
            color: #3b82f6;
            font-size: 0.9rem;
            cursor: pointer;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: linear-gradient(rgba(11, 15, 25, 0.85), rgba(11, 15, 25, 0.85)), url('img/fondo_miku.png');
            background-size: cover;
            background-position: center;
        }
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user {
            background-color: #2563eb;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .assistant {
            background-color: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(6px);
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .input-area {
            padding: 10px;
            background: rgba(15, 23, 42, 0.98);
            display: flex;
            gap: 8px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        input[type="text"] {
            flex: 1;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 10px 16px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        input:focus { border-color: #3b82f6; }
        button.send-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 0 18px;
            font-weight: bold;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <header>
        <span>🎧 Miku Nakano</span>
        <button class="config-btn" onclick="pedirApiKey()">⚙️ API Key</button>
    </header>

    <div id="chat-container">
        <div class="message assistant">¡Hola! Soy Miku. ¿De qué quieres hablar hoy?</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Escribe un mensaje..." autocomplete="off">
        <button class="send-btn" onclick="enviarMensaje()">Enviar</button>
    </div>

    <script>
        const MODEL_NAME = "gemini-1.5-pro";

        // Obtener o pedir la API Key guardada de forma segura en el celular
        function obtenerApiKey() {
            let key = localStorage.getItem("gemini_api_key");
            if (!key) {
                key = prompt("Por favor, ingresa tu API Key gratuita de Google AI Studio:");
                if (key) {
                    localStorage.setItem("gemini_api_key", key.trim());
                }
            }
            return key;
        }

        function pedirApiKey() {
            let key = prompt("Actualiza tu API Key de Google AI Studio:");
            if (key) {
                localStorage.setItem("gemini_api_key", key.trim());
                alert("¡API Key guardada correctamente en tu dispositivo!");
            }
        }

        let historialChats = [
            {
                role: "user",
                parts: [{ text: "Instrucción de sistema: Eres Miku Nakano del anime Gotoubun no Hanayome. Eres una chica tímida, reservada, llevas auriculares en el cuello, te encanta la historia Sengoku y eres muy cariñosa con las personas que te importan. Habla siempre en español, con un tono dulce y reservado. Nunca rompas el personaje." }]
            },
            {
                role: "model",
                parts: [{ text: "Entendido. Haré lo mejor posible." }]
            }
        ];

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') enviarMensaje();
        });

        async function enviarMensaje() {
            const texto = userInput.value.trim();
            if (!texto) return;

            const API_KEY = obtenerApiKey();
            if (!API_KEY) {
                alert("Se necesita una API Key para que Miku pueda responder.");
                return;
            }

            agregarMensaje(texto, 'user');
            userInput.value = '';
            
            historialChats.push({ role: "user", parts: [{ text: texto }] });

            const typingId = agregarMensaje("Pensando...", 'assistant');

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: historialChats })
                });

                const data = await response.json();
                document.getElementById(typingId).remove();

                if (data.candidates && data.candidates[0].content) {
                    const respuestaMiku = data.candidates[0].content.parts[0].text;
                    agregarMensaje(respuestaMiku, 'assistant');
                    
                    historialChats.push({ role: "model", parts: [{ text: respuestaMiku }] });
                    reproducirVoz(respuestaMiku);
                } else {
                    agregarMensaje("Hubo un problema al procesar la respuesta en la nube.", 'assistant');
                }
            } catch (error) {
                document.getElementById(typingId).remove();
                agregarMensaje("Error de conexión a internet.", 'assistant');
            }
        }

        function agregarMensaje(texto, remitente) {
            const div = document.createElement('div');
            div.className = `message ${remitente}`;
            div.id = 'msg-' + Date.now();
            div.innerText = texto;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div.id;
        }

        function reproducirVoz(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let textoLimpio = texto.replace(/\*/g, '').replace(/`/g, '');
                let utterance = new SpeechSynthesisUtterance(textoLimpio);
                utterance.lang = 'es-ES';
                utterance.rate = 1.08;
                utterance.pitch = 1.45;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
