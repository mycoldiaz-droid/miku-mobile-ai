<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Miku Nakano • AI Chat</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: rgba(15, 23, 42, 0.75);
            --header-bg: rgba(30, 41, 59, 0.85);
            --bubble-user: #3b82f6;
            --bubble-ai: rgba(30, 41, 59, 0.9);
            --text-main: #f8fafc;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.1), transparent 70%);
        }

        header {
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1rem;
        }

        .menu-actions { display: flex; gap: 8px; }

        .action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: #93c5fd;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* --- CONTENEDOR DEL AVATAR ANIMADO (CAMINANDO) --- */
        .pet-container {
            <div class="tenor-gif-embed" data-postid="20880400" data-share-method="host" data-aspect-ratio="1.45455" data-width="100%"><a href="https://tenor.com/view/miku-quintessential-the-quintuplets-gif-20880400">Miku Quintessential Sticker</a>from <a href="https://tenor.com/search/miku-stickers">Miku Stickers</a></div> <script type="text/javascript" async src="https://tenor.com/embed.js"></script>
            position: absolute;
            bottom: 65px; /* Justo arriba de la barra de texto */
            left: 0;
            z-index: 100;
            pointer-events: none; /* Para que puedas hacer clic a través de ella */
            animation: caminarPantalla 12s infinite alternate linear;
        }

        .pet-avatar {
            width: 75px;
            height: 75px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
        }

        @keyframes caminarPantalla {
            0% { 
                transform: translateX(-10px) scaleX(1); 
            }
            49% { 
                transform: translateX(calc(100vw - 80px)) scaleX(1); 
            }
            50% { 
                transform: translateX(calc(100vw - 80px)) scaleX(-1); /* Gira hacia la izquierda */
            }
            100% { 
                transform: translateX(-10px) scaleX(-1); 
            }
        }
        /* ------------------------------------------------ */

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
            background: rgba(11, 15, 25, 0.85);
        }

        .message-row { display: flex; width: 100%; }
        .message-row.user { justify-content: flex-end; }
        .message-row.assistant { justify-content: flex-start; }

        .message {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user {
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            background: var(--bubble-ai);
            border: 1px solid var(--border-color);
            color: #f1f5f9;
            border-bottom-left-radius: 4px;
        }

        .typing-dots { display: flex; gap: 4px; padding: 4px 0; }
        .typing-dots span {
            width: 7px; height: 7px; background: #94a3b8; border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        .input-area {
            padding: 10px 16px;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--border-color);
            z-index: 105;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 10px 18px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        button.send-btn {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 24px;
            padding: 0 18px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span>🎧 Miku AI Desktop</span>
        </div>
        <div class="menu-actions">
            <button class="action-btn" onclick="nuevoChat()">🗑️ Nuevo</button>
            <button class="action-btn" onclick="gestionarApiKey()">⚙️ Key</button>
        </div>
    </header>

    <!-- AVATAR QUE CAMINA POR LA PANTALLA -->
    <div class="pet-container">
        <img src="img/miku_walk.gif" alt="Miku caminando" class="pet-avatar" id="pet-sprite">
    </div>

    <div id="chat-container"></div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Escribe a Miku..." autocomplete="off">
        <button class="send-btn" onclick="enviarMensaje()">Enviar</button>
    </div>

    <script>
        const MODEL_NAME = "gemini-3.8-flash";
        
        const promptSistema = {
            role: "user",
            parts: [{ text: "Instrucción de sistema: Eres Miku Nakano del anime Gotoubun no Hanayome. Eres tímida, reservada, te encantan los auriculares, y hablas en español con un tono dulce y calmado." }]
        };

        const respuestaInicialSistema = {
            role: "model",
            parts: [{ text: "Entendido... Aquí estaré caminando por tu pantalla." }]
        };

        let historialChat = JSON.parse(localStorage.getItem("miku_chat_history")) || [promptSistema, respuestaInicialSistema];

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviarMensaje();
        });

        function renderizarHistorialUI() {
            chatContainer.innerHTML = '';
            for (let i = 2; i < historialChat.length; i++) {
                const item = historialChat[i];
                agregarMensajeUI(item.parts[0].text, item.role === 'user' ? 'user' : 'assistant');
            }
            if (historialChat.length <= 2) {
                agregarMensajeUI("¡Hola... estoy paseando por aquí. ¿De qué hablamos?", 'assistant');
            }
        }

        function obtenerApiKey() {
            let key = localStorage.getItem("gemini_api_key");
            if (!key) {
                key = prompt("Introduce tu API Key de Google AI Studio:");
                if (key) localStorage.setItem("gemini_api_key", key.trim());
            }
            return key;
        }

        function gestionarApiKey() {
            let actual = localStorage.getItem("gemini_api_key") / "" || "";
            let nueva = prompt("Actualiza tu API Key:", actual);
            if (nueva !== null) localStorage.setItem("gemini_api_key", nueva.trim());
        }

        function nuevoChat() {
            if (confirm("¿Borrar chat actual?")) {
                historialChat = [promptSistema, respuestaInicialSistema];
                localStorage.removeItem("miku_chat_history");
                renderizarHistorialUI();
            }
        }

        async function enviarMensaje() {
            const texto = userInput.value.trim();
            if (!texto) return;

            const API_KEY = obtenerApiKey();
            if (!API_KEY) return;

            agregarMensajeUI(texto, 'user');
            userInput.value = '';
            historialChat.push({ role: "user", parts: [{ text: texto }] });
            guardarHistorial();

            const typingId = mostrarEscribiendo();

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: historialChat })
                });

                const data = await response.json();
                removerEscribiendo(typingId);

                if (data.candidates && data.candidates[0].content) {
                    const respuestaMiku = data.candidates[0].content.parts[0].text;
                    historialChat.push({ role: "model", parts: [{ text: respuestaMiku }] });
                    guardarHistorial();
                    agregarMensajeUI(respuestaMiku, 'assistant');
                    reproducirVoz(respuestaMiku);
                } else {
                    agregarMensajeUI("Error de respuesta de la API.", 'assistant');
                }
            } catch (error) {
                removerEscribiendo(typingId);
                agregarMensajeUI("Error de red.", 'assistant');
            }
        }

        function agregarMensajeUI(texto, remitente) {
            const row = document.createElement('div');
            row.className = `message-row ${remitente}`;
            const msg = document.createElement('div');
            msg.className = `message ${remitente}`;
            msg.innerText = texto;
            row.appendChild(msg);
            chatContainer.appendChild(row);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function guardarHistorial() {
            localStorage.setItem("miku_chat_history", JSON.stringify(historialChat));
        }

        function mostrarEscribiendo() {
            const rowId = 'typing-' + Date.now();
            const row = document.createElement('div');
            row.className = `message-row assistant`;
            row.id = rowId;
            row.innerHTML = `<div class="message assistant"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
            chatContainer.appendChild(row);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return rowId;
        }

        function removerEscribiendo(rowId) {
            const el = document.getElementById(rowId);
            if (el) el.remove();
        }

        function reproducirVoz(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(texto.replace(/[\*\_\`]/g, ''));
                utterance.lang = 'es-ES';
                utterance.pitch = 1.4;
                window.speechSynthesis.speak(utterance);
            }
        }

        renderizarHistorialUI();
    </script>
</body>
</html>
